name: CI

on:
  workflow_dispatch:
  push:
    # main  = 发布线：每推一次（= 发一次正式版）版本号自动 +1，产物进 release-latest
    # debug = 测试线：沿用当前版本号，产物进 debug-latest（prerelease）
    # update = 只放升级配置 json，不构建产物（见 Publish 步骤的排除条件）
    branches: [ main, debug, update ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/**'
      - '.idea/**'
      - '!.github/workflows/**'

# 把 APK 发布到 GitHub Release 需要写权限（默认只读会 403）；
# 正式版构建完还要把涨过的版本号写回 main，同样用这个权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v3

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Write key
        # 所有分支都用发行密钥签名，测试包可直接 adb install -r 覆盖安装
        if: github.event_name != 'pull_request'
        run: |
          if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
            # 从网页粘贴的 base64 常夹带换行/行尾空格，先清洗再解码，否则 base64 -d 会直接报错
            echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > key.jks
            echo KEYSTORE_PATH='${{ github.workspace }}/key.jks' >> local.properties
            echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' >> local.properties
            echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}' >> local.properties
            echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          else
            echo "::waning::未配置 SIGN_KEYSTORE_BASE64，release 将退回 debug 签名（仅供测试，不可作为正式版分发）"
          fi

      # 注意：不要钉死补丁号（如 v4.0.2），GitHub 会把废弃的旧版本直接判失败
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: gradle-deps-core-${{ hashFiles('**/build.gradle.kts', '**/build.gradle', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-deps

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 渠道只影响 versionName 后缀：c001apk_next-V1.0.2-release / -debug
      - name: Resolve channel
        id: channel
        run: |
          case "${GITHUB_REF_NAME}" in
            main) C=release ;;
            *)    C=debug ;;
          esac
          echo "channel=$C" >> $GITHUB_OUTPUT
          echo "本次构建渠道：$C"

      # 正式版版本号：每推一次 main 就把 version.properties 的 patch +1、versionCode +1，
      # 用解出来的号构建（-Poverride*，见 app/build.gradle.kts），构建完再写回 main
      # 作为下一次的基线（最后的 Commit bumped version 步骤）。
      # debug / update 不解算，继续用文件里的当前号 —— 与正式版保持同一个 versionCode，
      # 用户可以 release / debug 来回覆盖安装。
      - name: Resolve version
        id: ver
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          NAME=$(grep -m1 '^VERSION_NAME=' version.properties | cut -d= -f2-)
          CODE=$(grep -m1 '^VERSION_CODE=' version.properties | cut -d= -f2-)
          BASE=${NAME#V}
          NEW_NAME="V${BASE%.*}.$(( ${BASE##*.} + 1 ))"
          NEW_CODE=$(( CODE + 1 ))
          echo "name=${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "code=${NEW_CODE}" >> $GITHUB_OUTPUT
          echo "版本号：${NAME}（${CODE}）→ ${NEW_NAME}（${NEW_CODE}）"

      - name: Build release
        id: buildRelease
        run: |
          set -o pipefail
          OVERRIDE=""
          if [ -n "${{ steps.ver.outputs.name }}" ]; then
            OVERRIDE="-PoverrideVersionName=${{ steps.ver.outputs.name }} -PoverrideVersionCode=${{ steps.ver.outputs.code }}"
          fi
          ./gradlew :app:assembleRelease -Pchannel=${{ steps.channel.outputs.channel }} $OVERRIDE --stacktrace 2>&1 | tee gradle-release.log
          echo "releaseName=$(ls app/build/outputs/apk/release/*.apk | awk -F '(/|\\.apk)' '{print $6}')" >> $GITHUB_OUTPUT

      - name: Upload release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # 加 release- 前缀：debug 分支上 release 包的 versionName 也是 -debug，
          # 与 debug 包同名，不加前缀会撞名 409
          name: release-${{ steps.buildRelease.outputs.releaseName }}
          path: "app/build/outputs/apk/release/*.apk"

      # 每次都把 release 的签名证书指纹打到日志，防止某次悄悄退回 debug 签名
      - name: Verify release signature
        if: success() && github.event_name != 'pull_request'
        run: |
          set -o pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
            echo "::notice::$(basename "$APK") 签名证书 SHA-256 = $(grep -m1 'certificate SHA-256 digest' /tmp/certs.txt | sed 's/.*digest: //')"
          else
            echo "::waning::未找到 apksigner，跳过签名校验"
          fi

      - name: Upload mappings
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mappings
          path: "app/build/outputs/mapping/release"

      - name: Build debug
        id: buildDebug
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee gradle-debug.log
          echo "debugName=$(ls app/build/outputs/apk/debug/*.apk | awk -F '(/|\\.apk)' '{print $6}')" >> $GITHUB_OUTPUT

      - name: Upload debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ steps.buildDebug.outputs.debugName }}
          path: "app/build/outputs/apk/debug/*.apk"

      # 每个分支把各自编译出来的发行版放到「自己固定位置」的 GitHub Release：
      #   main  → release-latest（正式版）
      #   debug → debug-latest（测试版，prerelease）
      # update 分支只放更新配置（json），不发布产物。
      - name: Publish to GitHub Releases
        if: success() && github.event_name == 'push' && github.ref_name != 'update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            main) TAG=release-latest; TITLE="正式版（main 自动构建）"; PRE=() ;;
            *)    TAG=debug-latest;   TITLE="测试版（debug 自动构建）"; PRE=(--prerelease) ;;
          esac

          # 只发布正式签名的发行包。debug 构建出的包与它同名（都叫 xxx-debug(版本号).apk），
          # 而 GitHub 会把文件名里的 ( ) 规范化成 .，两个包放同一位置会撞名（422 already_exists），
          # 所以 debug 包继续在 Actions 的 artifact 里下载。
          FILES=()
          for f in app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then FILES+=("$f"); fi
          done
          echo "本次发布产物：${FILES[*]}"

          # main 上 version.properties 里存的是「上一次发过的」号，本次用的是 Resolve version
          # 解出来的号；非 main 分支没有 override，直接读文件
          VERSION="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 '^VERSION_NAME=' version.properties | cut -d= -f2-)
            CODE=$(grep -m1 '^VERSION_CODE=' version.properties | cut -d= -f2-)
          fi
          NOTES=/tmp/release-notes.md
          {
            echo "自动构建：\`${GITHUB_REF_NAME}\` 分支 @ ${GITHUB_SHA:0:7}"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${VERSION}（versionCode ${CODE}） |"
            echo "| 渠道 | ${{ steps.channel.outputs.channel }} |"
            echo "| 提交 | ${GITHUB_SHA} |"
            echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } > "$NOTES"

          # 追加仓库内维护的功能清单（.github/release-notes.md），
          # 让发行版页面始终带一份完整的功能说明，而不是只有自动构建信息
          if [ -f .github/release-notes.md ]; then
            {
              echo
              echo "---"
              echo
              cat .github/release-notes.md
            } >> "$NOTES"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" "${PRE[@]}"
          else
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES" \
              --target "$GITHUB_REF_NAME" "${PRE[@]}"
          fi

          # 每个位置只留最新一份：上传前先清空上一次的产物（版本号变化后文件名也不同）
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r n; do
            if [ -n "$n" ]; then gh release delete-asset "$TAG" "$n" --yes; fi
          done

          # release 刚建出来时立刻上传会偶发 404（服务端还没就绪），失败就退避重试
          ok=0
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" "${FILES[@]}" --clobber; then ok=1; break; fi
            echo "::waning::发布 ${TAG} 上传失败（第 ${i} 次），5 秒后重试"
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::发布 ${TAG} 失败，产物未上传"
            exit 1
          fi

          # 把本次发行版的位置写进 run summary 和 annotation，方便直接拿链接。
          # asset 名由 GitHub 规范化（文件名里的 ( ) 会变成 .），所以链接以服务端返回的名字为准
          export BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "## 发行版位置"
            echo
            echo "- ${TITLE}：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            gh release view "$TAG" --json assets --jq '.assets[] | "  - \(env.BASE)/\(.name)"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::${TITLE} → https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      # 正式版：把本次用掉的版本号写回 main，作为下一次 +1 的基线。
      # GITHUB_TOKEN 的推送本身不会再触发 workflow，再加 [skip ci] 双保险。
      - name: Commit bumped version
        if: success() && github.ref_name == 'main'
        run: |
          set -euo pipefail
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${{ steps.ver.outputs.name }}/" version.properties
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${{ steps.ver.outputs.code }}/" version.properties
          git add version.properties
          if git diff --cached --quiet; then
            echo "版本号无变化，跳过提交"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(release): ${{ steps.ver.outputs.name }}（versionCode ${{ steps.ver.outputs.code }}）[skip ci]"
          git push origin HEAD:main
          echo "::notice::已把 ${{ steps.ver.outputs.name }}（${{ steps.ver.outputs.code }}）写回 main，下次发布在此基础上 +1"

      # 失败时把 Gradle 日志尾部转成 annotation，
      # 这样在 Actions 页面和失败通知邮件里就能直接看到原因，不用再翻完整日志
      - name: Report Gradle failure
        # 只在 Gradle 构建本身失败时 tail 日志；上传/签名等步骤失败不再刷一堆假 error
        if: failure() && (steps.buildRelease.outcome == 'failure' || steps.buildDebug.outcome == 'failure')
        run: |
          echo "::error::REPORT-STEP | pwd=$(pwd) | logs=$(ls -1 gradle-*.log 2>/dev/null | tr '\n' ' ')"
          for f in gradle-release.log gradle-debug.log; do
            if [ -f "$f" ]; then
              echo "::error::logs found: $f ($(wc -c < "$f") bytes)"
              tail -120 "$f" | while IFS= read -r line; do echo "::error::$line"; done
              break
            fi
          done
