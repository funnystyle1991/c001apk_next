# ===== 发行版本信息（唯一真源）=====
# 规则：正式版只在 main 分支发布，每推一次 main（= 发一次正式版），CI 自动把 patch +1、
#       VERSION_CODE +1，用新号构建并把新号写回本文件提交，作为下一次 +1 的基线。
#       debug 线只读当前号、不涨号，所以正式版与测试版 versionCode 一致，可来回覆盖安装。
#       手工改这里只用于跳号或回退（改完 commit 到 main 即成为新基线）。
#
# VERSION_CODE：必须大于线上已发布的值（旧方案用 git 提交数，已经到 504），否则更新提示不触发
# VERSION_NAME：带 V 前缀，最终拼成 c001apk_next-<VERSION_NAME>-<release|debug>
VERSION_CODE=10002
VERSION_NAME=V1.0.2
