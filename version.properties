# ===== 发行版本信息（唯一真源，发布时只改这里）=====
# 规则：只有 beta 阶段主动推进版本号；main 继承 beta 的版本号一起走；
#       debug 快速迭代跟随 beta 的版本号（不单独涨号）。
#       这样同一个开发周期内 release / beta / debug 三端 versionCode 一致，
#       用户可以丝滑来回切换安装。
#
# VERSION_CODE：必须大于线上已发布的值（旧方案用 git 提交数，已经到 504），否则更新提示不触发
# VERSION_NAME：带 V 前缀，最终拼成 c001apk_next-<VERSION_NAME>-<release|beta|debug>
VERSION_CODE=10002
VERSION_NAME=V1.0.2
